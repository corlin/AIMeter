apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aimeter.fullname" . }}-backend-config
  labels:
    {{- include "aimeter.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  aimeter.yaml: |
    server:
      http_port: {{ .Values.backend.service.httpPort }}
      grpc_port: {{ .Values.backend.service.otlpGrpcPort }}
      otlp_http_port: {{ .Values.backend.service.otlpHttpPort }}
      env: production

    database:
      clickhouse:
        addr: "{{ .Values.database.clickhouse.addr }}"
        database: "{{ .Values.database.clickhouse.database }}"
        username: "{{ .Values.database.clickhouse.username }}"
        password: "{{ .Values.database.clickhouse.password }}"
      postgres:
        dsn: "{{ .Values.database.postgres.dsn }}"

    collector:
      batch_size: {{ .Values.collector.batchSize }}
      flush_interval_ms: {{ .Values.collector.flushIntervalMs }}

    rates:
      seed_file: "{{ .Values.rates.seedFile }}"
      cache_ttl_minutes: {{ .Values.rates.cacheTTLMinutes }}
