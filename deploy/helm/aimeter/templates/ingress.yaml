{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aimeter.fullname" . }}
  labels:
    {{- include "aimeter.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ ternary (printf "%s-backend" (include "aimeter.fullname" $)) (printf "%s-frontend" (include "aimeter.fullname" $)) (eq .backendService "backend") }}
                port:
                  number: {{ ternary $.Values.backend.service.httpPort $.Values.frontend.service.port (eq .backendService "backend") }}
          {{- end }}
    {{- end }}
{{- end }}
