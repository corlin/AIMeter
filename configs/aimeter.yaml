server:
  http_port: 8080
  grpc_port: 4317
  otlp_http_port: 4318
  env: development

database:
  clickhouse:
    addr: "localhost:9000"
    database: "aimeter"
    username: "default"
    password: ""
  postgres:
    dsn: "postgres://aimeter:aimeter@localhost:5433/aimeter?sslmode=disable"

collector:
  batch_size: 500
  flush_interval_ms: 200

rates:
  seed_file: "configs/rates_seed.json"
  cache_ttl_minutes: 60

auth:
  enabled: false # true: enforce API keys on proxy, guard, telemetry and /api/v1 (reads need read:metrics, writes need admin:*; non-admin keys are pinned to their tenant). Bootstrap admin via AIMETER_ADMIN_KEY env.

