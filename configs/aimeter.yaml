server:
  http_port: 8080
  grpc_port: 4317
  otlp_http_port: 4318
  env: development

database:
  clickhouse:
    addr: "localhost:9000"
    database: "aimeter"
    username: "default"
    password: ""
  postgres:
    dsn: "postgres://aimeter:aimeter@localhost:5433/aimeter?sslmode=disable"

collector:
  batch_size: 500
  flush_interval_ms: 200

rates:
  seed_file: "configs/rates_seed.json"
  cache_ttl_minutes: 60

auth:
  enabled: false # Set to true to enforce strict API key authentication across all gateway and guard endpoints

